name: Repository checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install OpenCode V2
        run: npm install --global @opencode/cli@beta

      - name: Fix dependency vulnerabilities
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm audit fix

      - name: Fix unused code and dependencies
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npx knip --fix

      - name: Fix lint findings
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npx eslint . --fix

      - name: Format repository
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npm run format

      - name: Commit automatic fixes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- .; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m "style: apply automatic repository fixes"
          git push

      - name: Refresh dependencies after fixes
        if: github.event_name != 'pull_request'
        run: npm install

      - name: Check formatting
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Test
        id: test
        continue-on-error: true
        run: npm run test

      - name: Check dependency architecture
        id: deps
        continue-on-error: true
        run: npm run check:deps

      - name: Check unused code and dependencies
        id: knip
        continue-on-error: true
        run: npm run check:knip

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: npm run audit

      - name: Pack package
        id: pack
        continue-on-error: true
        run: npm pack --dry-run

      - name: Fail if any validation gate failed
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          KNIP_OUTCOME: ${{ steps.knip.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
        run: |
          printf '%s\n' \
            "format=$FORMAT_OUTCOME" \
            "lint=$LINT_OUTCOME" \
            "typecheck=$TYPECHECK_OUTCOME" \
            "test=$TEST_OUTCOME" \
            "deps=$DEPS_OUTCOME" \
            "knip=$KNIP_OUTCOME" \
            "audit=$AUDIT_OUTCOME" \
            "pack=$PACK_OUTCOME"
          for outcome in \
            "$FORMAT_OUTCOME" \
            "$LINT_OUTCOME" \
            "$TYPECHECK_OUTCOME" \
            "$TEST_OUTCOME" \
            "$DEPS_OUTCOME" \
            "$KNIP_OUTCOME" \
            "$AUDIT_OUTCOME" \
            "$PACK_OUTCOME"
          do
            if [ "$outcome" != "success" ]; then
              exit 1
            fi
          done
