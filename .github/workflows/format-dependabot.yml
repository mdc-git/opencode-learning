name: Format Dependabot YAML

on:
  push:
    branches:
      - repair/xo5-learning-final

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/xo5-learning-final
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format Dependabot config
        run: bun run prettier .github/dependabot.yml --write --config tooling/prettier.json
      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/format-dependabot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/dependabot.yml
          git commit -m "fix(format): normalize Dependabot config"
          git push
