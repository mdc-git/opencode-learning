name: Cleanup

on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  packages: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' |
            while read -r run_id; do
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            done

      - name: Delete untagged container images
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          packages="$(
            gh api \
              --paginate \
              "users/${GITHUB_REPOSITORY_OWNER}/packages?package_type=container&per_page=100"
          )"

          if ! printf '%s\n' "$packages" |
            jq -e --arg package "$PACKAGE_NAME" '.[] | select(.name == $package)' >/dev/null
          then
            echo "No container package named $PACKAGE_NAME."
            exit 0
          fi

          gh api \
            --paginate \
            "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" |
            jq -r '.[] | select((.metadata.container.tags // []) | length == 0) | .id' |
            while read -r version_id; do
              gh api --method DELETE \
                "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}"
            done
