name: Cleanup

on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  packages: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' |
            while read -r run_id; do
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            done

      - name: Delete untagged container images
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          versions_file="${RUNNER_TEMP}/container-versions.json"
          error_file="${RUNNER_TEMP}/container-versions.error"

          if ! gh api \
            --paginate \
            --slurp \
            "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            >"$versions_file" 2>"$error_file"
          then
            if grep -q 'HTTP 404' "$error_file"; then
              echo "No container package named $PACKAGE_NAME."
              exit 0
            fi

            cat "$error_file" >&2
            exit 1
          fi

          jq -r \
            'add[] | select((.metadata.container.tags // []) | length == 0) | .id' \
            "$versions_file" |
            while read -r version_id; do
              gh api --method DELETE \
                "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}"
            done
